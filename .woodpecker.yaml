when:
  - event: push
    branch: [main, development]
  - event: manual

labels:
  backend: local
  platform: darwin/arm64

steps:
  - name: build-and-test
    image: bash
    environment:
      JAVA_HOME: /opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
      UV_PYTHON: "3.12"
    commands:
      - mkdir -p .ci-output
      - git clone --quiet --no-checkout git@github.com:alehkot/build-scripts.git .ci-output/build-scripts
      - git -C .ci-output/build-scripts checkout --quiet --detach f0bf333270639b4e26f8d6442d083dde0e2ca008
      - bash .ci-output/build-scripts/run.sh caffeinate -i bash .ci/check.sh

  - name: commit-comment
    image: bash
    environment:
      GH_TOKEN:
        from_secret: github_comment_token
    commands:
      - python3 -B .ci-output/build-scripts/report.py
    when:
      - status: [success, failure]
